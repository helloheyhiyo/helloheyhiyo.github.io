<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tiny Crisis · You're in</title>
<meta name="theme-color" content="#7F1A1E">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/bagel-fat-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
.joined{min-height:100svh;display:grid;align-content:center;padding:48px 0}
.joined .kicker{margin-bottom:14px}
.joined h1{font-size:clamp(54px,14vw,120px);margin-bottom:18px}
.joined h1 span{color:var(--gold)}
.joined p{font-size:clamp(17px,4.6vw,21px);max-width:30ch;margin-bottom:12px}
.joined .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.joined .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--gold);color:var(--ink);font:700 14px/1 var(--type);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.joined .btn.alt{background:transparent;color:var(--paper);border:2px solid var(--paper)}
.joined .micro{font:400 14px/1.4 var(--type);opacity:.8;margin-top:22px}
</style>
</head>
<body>
<main class="joined">
  <div class="wrap">
    <p class="kicker">Case file opened</p>
    <h1>You're <span>in.</span></h1>
    <p>Your name wasn't on the list. Now it is. We checked twice.</p>
    <p>One more thing: tell the friend with a shower coming up. She'll thank you. Eventually.</p>
    <div class="row">
      <a class="btn" href="https://wa.me/?text=Something%20is%20being%20wrapped.%20Get%20on%20the%20list%3A%20https%3A%2F%2Fthetinycrisis.com" target="_blank" rel="noopener">Tell a friend</a>
      <a class="btn alt" href="https://www.instagram.com/thetinycrisis/" target="_blank" rel="noopener">Follow @thetinycrisis</a>
    </div>
    <p class="micro">Designed in Dubai · <a href="/">back to the box</a></p>
  </div>
</main>
</body>
</html>
